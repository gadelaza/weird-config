## hyprlock configuration ##

general {
    grace = 1
}

# background

background {
    monitor = 
	path = ~/Backgrounds/monjave.jpg

    blur_size = 10
    blur_passes = 1
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = 
    inner_color = 
    font_color = rgba(48556Eff)
    placeholder_text = <i>Password...</i>
    hide_input = false
    
    position = 0, 80
    halign = center
    valign = bottom
}

# Date
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%-d %B %Y')" </b>"
    color = rgba(48556Eff)
    font_size = 34
    font_family = 0xProto Nerd Font 10

    position = 0, -40
    halign = center
    valign = top
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M") </big></b>" # 24H
    color = rgba(48556Eff)
    font_size = 100
    font_family = JetBrains Mono 10

    position = 0, 100
    halign = center
    valign = center
}

# User
label {
    monitor =
    text =    SAM
    color = white
    font_size = 13
    font_family = Inter Display Medium

    position = 0, 20
    halign = center
    valign = bottom
}

# user picture
image {
    monitor =
    path = ~/Backgrounds/Yoru.png
    size = 160
    rounding = -1
    border_size = 2
    border_color = rgba(48556Eff)
    rotate = 0
    reload_time = -1
    position = 0, 160
    halign = center
    valign = bottom
}
